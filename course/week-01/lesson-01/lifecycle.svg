<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Yukning to‘qqiz bosqichi</title><desc id="desc">Qidiruvdan booking, rate con, dispatch, pickup, transit va delivery hujjatigacha ketma-ket jarayon.</desc><style>svg{--paper:#fffdf9;--panel:#f1eae0;--ink:#3a3229;--muted:#6c6052;--accent:#285eae;--line:#c8bda9}text{font-family:Inter,Arial,sans-serif;fill:var(--ink)}.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.line{fill:none;stroke:var(--accent);stroke-width:3;marker-end:url(#arrow)}.label{font-size:21px;font-weight:700}.sub{font-size:16px;fill:var(--muted)}.head{font-size:26px;font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="var(--accent)"/></marker></defs><rect width="960" height="510" rx="20" fill="var(--paper)"/><text class="head" x="36" y="44">Yukning to‘liq yo‘li</text><rect class="box" x="35" y="80" width="260" height="82" rx="12"/><text class="label" x="165.0" y="112" text-anchor="middle">01 · LOAD SEARCH</text><text class="sub" x="165.0" y="139" text-anchor="middle">Mos yukni izlash</text><path class="line" d="M295 121 H335"/><rect class="box" x="350" y="80" width="260" height="82" rx="12"/><text class="label" x="480.0" y="112" text-anchor="middle">02 · BOOKING</text><text class="sub" x="480.0" y="139" text-anchor="middle">Shartlarni kelishish</text><path class="line" d="M610 121 H650"/><rect class="box" x="665" y="80" width="260" height="82" rx="12"/><text class="label" x="795.0" y="112" text-anchor="middle">03 · RATE CON</text><text class="sub" x="795.0" y="139" text-anchor="middle">Yozma shartni tekshirish</text><path class="line" d="M925 121 H935 V185 H20 V251 H25"/><rect class="box" x="35" y="210" width="260" height="82" rx="12"/><text class="label" x="165.0" y="242" text-anchor="middle">04 · DISPATCH</text><text class="sub" x="165.0" y="269" text-anchor="middle">Driverga ma’lumot</text><path class="line" d="M295 251 H335"/><rect class="box" x="350" y="210" width="260" height="82" rx="12"/><text class="label" x="480.0" y="242" text-anchor="middle">05 · EMPTY TRAVEL</text><text class="sub" x="480.0" y="269" text-anchor="middle">Pickup tomon bo‘sh borish</text><path class="line" d="M610 251 H650"/><rect class="box" x="665" y="210" width="260" height="82" rx="12"/><text class="label" x="795.0" y="242" text-anchor="middle">06 · CHECK-IN</text><text class="sub" x="795.0" y="269" text-anchor="middle">Kelish va qayd</text><path class="line" d="M925 251 H935 V315 H20 V381 H25"/><rect class="box" x="35" y="340" width="260" height="82" rx="12"/><text class="label" x="165.0" y="372" text-anchor="middle">07 · LOADING / BOL</text><text class="sub" x="165.0" y="399" text-anchor="middle">Ortish, hujjat, chiqish</text><path class="line" d="M295 381 H335"/><rect class="box" x="350" y="340" width="260" height="82" rx="12"/><text class="label" x="480.0" y="372" text-anchor="middle">08 · IN TRANSIT</text><text class="sub" x="480.0" y="399" text-anchor="middle">Yo‘ldagi kuzatuv</text><path class="line" d="M610 381 H650"/><rect class="box" x="665" y="340" width="260" height="82" rx="12"/><text class="label" x="795.0" y="372" text-anchor="middle">09 · DELIVERY / POD</text><text class="sub" x="795.0" y="399" text-anchor="middle">Qabul va hujjat</text><text class="sub" x="36" y="480">Har bosqich alohida tasdiqlanadi. Arrival ≠ loading ≠ departure.</text></svg>