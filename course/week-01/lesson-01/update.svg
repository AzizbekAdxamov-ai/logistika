<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title desc"><title id="title">Tasdiqlangan ma’lumotdan aniq updategacha</title><desc id="desc">Avval faktni ajrating, keyin noma’lumni belgilang, so‘ng fakt va keyingi qadam bilan xabar yozing.</desc><style>svg{--paper:#fffdf9;--panel:#f1eae0;--ink:#3a3229;--muted:#6c6052;--accent:#285eae;--line:#c8bda9}text{font-family:Inter,Arial,sans-serif;fill:var(--ink)}.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.line{fill:none;stroke:var(--accent);stroke-width:3;marker-end:url(#arrow)}.label{font-size:21px;font-weight:700}.sub{font-size:16px;fill:var(--muted)}.head{font-size:26px;font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="var(--accent)"/></marker></defs><rect width="960" height="255" rx="20" fill="var(--paper)"/><text class="head" x="36" y="44">Ishonchli update qanday tuziladi?</text><rect class="box" x="35" y="90" width="260" height="82" rx="12"/><text class="label" x="165.0" y="122" text-anchor="middle">1 · TASDIQLANGAN</text><text class="sub" x="165.0" y="149" text-anchor="middle">Load ID, manba, vaqt, holat</text><rect class="box" x="350" y="90" width="260" height="82" rx="12"/><text class="label" x="480.0" y="122" text-anchor="middle">2 · NOMA’LUM</text><text class="sub" x="480.0" y="149" text-anchor="middle">ETA yoki departure yo‘qmi?</text><rect class="box" x="665" y="90" width="260" height="82" rx="12"/><text class="label" x="795.0" y="122" text-anchor="middle">3 · ANIQ XABAR</text><text class="sub" x="795.0" y="149" text-anchor="middle">Fakt + kutilayotgan qadam</text><path class="line" d="M295 131 H335"/><path class="line" d="M610 131 H650"/><text class="sub" x="36" y="220">Noma’lum ma’lumotni taxmin bilan to‘ldirmang; tekshirish uchun savol bering.</text></svg>