<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Logistikadagi yetti rol</title><desc id="desc">Shipperdan receiverga yukni carrier tashiydi. Broker tashkil qiladi. Carrier jamoasi dispatcher, updater va driverdan iborat.</desc><style>svg{--paper:#fffdf9;--panel:#f1eae0;--ink:#3a3229;--muted:#6c6052;--accent:#285eae;--line:#c8bda9}text{font-family:Inter,Arial,sans-serif;fill:var(--ink)}.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.line{fill:none;stroke:var(--accent);stroke-width:3;marker-end:url(#arrow)}.label{font-size:21px;font-weight:700}.sub{font-size:16px;fill:var(--muted)}.head{font-size:26px;font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="var(--accent)"/></marker></defs><rect width="960" height="500" rx="20" fill="var(--paper)"/><text class="head" x="36" y="44">Yuk harakati va jamoa rollari</text><rect class="box" x="35" y="85" width="220" height="82" rx="12"/><text class="label" x="145.0" y="117" text-anchor="middle">SHIPPER</text><text class="sub" x="145.0" y="144" text-anchor="middle">Yukni jo‘natadi</text><rect class="box" x="370" y="85" width="220" height="82" rx="12"/><text class="label" x="480.0" y="117" text-anchor="middle">CARRIER</text><text class="sub" x="480.0" y="144" text-anchor="middle">Yukni tashiydi</text><rect class="box" x="705" y="85" width="220" height="82" rx="12"/><text class="label" x="815.0" y="117" text-anchor="middle">RECEIVER</text><text class="sub" x="815.0" y="144" text-anchor="middle">Yukni qabul qiladi</text><path class="line" d="M255 126 H355"/><path class="line" d="M590 126 H690"/><rect class="box" x="35" y="240" width="220" height="82" rx="12"/><text class="label" x="145.0" y="272" text-anchor="middle">BROKER</text><text class="sub" x="145.0" y="299" text-anchor="middle">Tashishni tashkil qiladi</text><path class="line" d="M145 240 V182 H445 V167"/><text class="sub" x="290" y="220">Kelishuv va aloqa</text><rect class="box" x="325" y="250" width="600" height="180" rx="16"/><text class="sub" x="345" y="279">Carrier jamoasi</text><rect class="box" x="345" y="305" width="175" height="82" rx="12"/><text class="label" x="432.5" y="337" text-anchor="middle">DISPATCHER</text><text class="sub" x="432.5" y="364" text-anchor="middle">Ishni muvofiqlaydi</text><rect class="box" x="537" y="305" width="175" height="82" rx="12"/><text class="label" x="624.5" y="337" text-anchor="middle">UPDATER</text><text class="sub" x="624.5" y="364" text-anchor="middle">Holatni xabar qiladi</text><rect class="box" x="730" y="305" width="175" height="82" rx="12"/><text class="label" x="817.5" y="337" text-anchor="middle">DRIVER</text><text class="sub" x="817.5" y="364" text-anchor="middle">Transportni haydaydi</text><path class="line" d="M480 167 V235"/><text class="sub" x="36" y="470">Strelkalar yuqorida yuk yo‘lini, pastda ish aloqasini ko‘rsatadi.</text></svg>